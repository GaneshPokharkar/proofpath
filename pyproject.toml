[project]
name = "jobpilot"
version = "0.1.0"
description = "AI job-search agent with hybrid semantic search over live job postings"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (Vercel installs from this list).
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "pgvector==0.5.1",
    "alembic==1.20.1",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
    "fastembed==0.9.1",
    "beautifulsoup4==4.15.0",
    "PyYAML==6.0.3",
    "anthropic==2.11.0",
    "pypdf==7.1.1",
    "python-multipart==0.0.34",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in defaults is the intended pattern

[tool.ruff.lint.per-file-ignores]
"app/ingest/classify.py" = ["E501"]
"app/ingest/deadline.py" = ["E501"]  # one regex rule per line reads better than wrapped fragments

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx` with `starlette.testclient`"]
