name: Deploy checks

# Vercel builds a preview for every pull request and production for every push to main, and
# reports each one back to GitHub as a deployment. When a deployment goes live, this smoke-tests
# that exact URL and commit. A failed production check is a red X on the commit and an email.
on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.deployment.environment }}
      url: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install httpx==0.28.1
      - name: Smoke test the deployment
        env:
          URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: python scripts/smoke.py "$URL" --commit "${{ github.event.deployment.sha }}" --wait 600
