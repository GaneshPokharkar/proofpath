name: Deploy checks

# Vercel builds a preview for every pull request and reports it to GitHub as a deployment.
# When one goes live, this smoke-tests that exact URL and commit. (Production is verified by the
# "verify-production" job in ci.yml, which runs after every merge to main.) GitHub also creates
# deployment events for the workflows' own environments; those are skipped by the URL check.
on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.environment_url || github.event.deployment_status.target_url, '.vercel.app')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.deployment.environment }}
      url: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install httpx==0.28.1
      - name: Smoke test the deployment
        env:
          URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: python scripts/smoke.py "$URL" --commit "${{ github.event.deployment.sha }}" --wait 600
