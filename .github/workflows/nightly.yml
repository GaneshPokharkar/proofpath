name: Nightly

# Catches what no code change triggers: a job board changing its API, a new CVE in a pinned
# dependency, or the live site degrading.
on:
  schedule:
    - cron: "17 21 * * *"   # 02:47 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install httpx==0.28.1
      - run: python scripts/smoke.py https://proofpath-ganeshpokharkars-projects.vercel.app

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt

  job-boards:
    # Fetches one board per source type and fails if any parser no longer understands the response.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - run: python scripts/check_sources.py
