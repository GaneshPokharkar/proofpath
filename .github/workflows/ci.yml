name: CI

# Every pull request and every push to main. Branch protection requires the "ci-passed" job,
# so nothing merges to main (and so nothing deploys) unless all of these are green.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install ruff==0.17.6
      - run: ruff check .
      - run: ruff format --check .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -q -c pyproject.toml -r app -ll
      - name: No secrets committed
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: jobpilot_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      JOBPILOT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jobpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Tests with coverage (fails under 80%)
        run: pytest -q --cov=app --cov-report=term --cov-report=xml --cov-fail-under=80
      - name: Migrations apply cleanly from empty, and roll back
        env:
          JOBPILOT_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jobpilot_test
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE migrate_check"
          JOBPILOT_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/migrate_check alembic upgrade head
          JOBPILOT_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/migrate_check alembic downgrade 0006
          JOBPILOT_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/migrate_check alembic upgrade head
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: coverage, path: coverage.xml }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Page scripts parse
        run: |
          for f in app/web/*.html; do
            python3 -c "import re,sys; s=open(sys.argv[1]).read(); open('/tmp/page.js','w').write('\n'.join(re.findall(r'<script>(.*?)</script>', s, re.S)))" "$f"
            node --check /tmp/page.js && echo "ok $f"
          done

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t proofpath:${{ github.sha }} .
      - name: Run the stack and smoke test it
        run: |
          docker compose up -d --build api
          for i in $(seq 1 40); do curl -fs localhost:8000/health && break; sleep 3; done
          curl -fs localhost:8000/health
          curl -fs "localhost:8000/version"
          docker compose down -v

  ci-passed:
    # The one check branch protection requires.
    runs-on: ubuntu-latest
    needs: [lint, security, test, web, docker]
    if: always()
    steps:
      - name: All checks green
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed: ${{ toJSON(needs) }}"; exit 1
          fi

  migrate:
    # Schema changes go to the production database only after every check above passed on main.
    runs-on: ubuntu-latest
    needs: [ci-passed]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      JOBPILOT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.txt }
      - name: Skip when the database secret is not set
        id: secret
        run: |
          if [ -z "$JOBPILOT_DATABASE_URL" ]; then
            echo "::notice::PRODUCTION_DATABASE_URL is not set; the app applies additive schema steps itself on start."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secret.outputs.missing != 'true'
        run: pip install -r requirements.txt && alembic upgrade head
